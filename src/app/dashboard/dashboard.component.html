<app-header [kpiList]="(kpiList$ | async) ?? undefined" [error]="errorMessage"/>
<main>
  @if(loading()) {
    <app-loading-spinner/>
  }

  @if (!errorMessage) {
    <app-medal-chart
      [canvasId]="chartId"
      label="Pie chart showing medals by country"
      chartType="pie"/>
  } @else {
    <app-error [errorMessage]="errorMessage" [actionMessage]="actionMessage" [isBackButton]="false" />
}
</main>
