@if (kpiList$ | async; as kpiList) {
  <app-header [kpiList]="kpiList" [error]="errorMessage"/>
}
<main>
  @if (!errorMessage) {
    <app-medal-chart
      [canvasId]="chartId"
      label="Pie chart showing medals by country"
      chartType="pie"/>
  } @else {
    <app-error [errorMessage]="errorMessage" [actionMessage]="actionMessage" [isBackButton]="false" />
  }
</main>
